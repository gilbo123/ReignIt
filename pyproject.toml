[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reignit"
version = "0.1.0"
description = "Agentic harness that injects a project wiki so local models can work without ingesting the full codebase."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "ReignIt" }]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "typer>=0.12",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
reignit = "reignit.cli:app"

[project.urls]
Homepage = "https://github.com/gilberteaton/ReignIt"

[tool.hatch.build.targets.wheel]
packages = ["src/reignit"]

[tool.hatch.build.targets.wheel.sources]
"src/reignit" = "reignit"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
